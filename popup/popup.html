<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <style>
    body { font: 13px/1.4 sans-serif; width: 300px; margin: 0; padding: 10px; }
    h3 { margin: 0 0 8px; font-size: 14px; }
    .row { display: flex; align-items: center; gap: 6px; padding: 3px 0; }
    .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .del { cursor: pointer; color: #a33; padding: 0 4px; }
    input.color { width: 22px; height: 22px; padding: 0; border: 1px solid #bbb; border-radius: 4px; }
    .form { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
    .form input { padding: 4px; }
    .buttons { display: flex; gap: 6px; margin-top: 8px; flex-wrap: wrap; }
    .status { color: #777; font-size: 12px; margin-top: 6px; min-height: 16px; }
  </style>
</head>
<body>
  <h3>Squadrats Komoot Overlay</h3>
  <div id="list"></div>
  <div class="form">
    <input id="uid" placeholder="Squadrats UID" />
    <input id="alias" placeholder="Alias (optional)" />
    <button id="add">+ Add user</button>
  </div>
  <div class="buttons">
    <button id="import">Import follows from squadrats.com tab</button>
    <button id="clear">Clear tile cache</button>
  </div>
  <div id="status" class="status"></div>
  <script src="popup.js"></script>
</body>
</html>
