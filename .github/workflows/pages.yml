name: Pages

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches manifest version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          V=$(grep -o '"version": *"[^"]*"' manifest.json | cut -d'"' -f4)
          if [ "$V" != "${GITHUB_REF_NAME#v}" ]; then
            echo "manifest.json version $V does not match tag ${GITHUB_REF_NAME}"; exit 1
          fi

      - name: Stage extension files
        run: |
          mkdir -p dist/ext
          cp -r manifest.json content page popup dist/ext/

      - name: Build unsigned package
        run: |
          (cd dist/ext && zip -qr ../sqomoot-firefox.xpi .)

      - name: Check AMO signing credentials
        id: signing
        env:
          AMO_KEY: ${{ secrets.AMO_API_KEY }}
        run: |
          if [ -n "$AMO_KEY" ]; then echo present=true >> "$GITHUB_OUTPUT"; else echo present=false >> "$GITHUB_OUTPUT"; fi

      - name: Sign with AMO (unlisted)
        if: steps.signing.outputs.present == 'true' && startsWith(github.ref, 'refs/tags/v')
        run: |
          npm install --global web-ext
          web-ext sign \
            --source-dir dist/ext \
            --channel=unlisted \
            --api-key "${{ secrets.AMO_API_KEY }}" \
            --api-secret "${{ secrets.AMO_API_SECRET }}" \
            --artifacts-dir dist/signed
          cp "$(ls dist/signed/*.xpi | head -n 1)" dist/sqomoot-firefox.xpi

      - name: Reuse published signed package (site-only deploy)
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: curl -sfL https://forgems.github.io/sqomoot/sqomoot-firefox.xpi -o dist/sqomoot-firefox.xpi

      - name: Assemble site
        run: |
          cp dist/sqomoot-firefox.xpi site/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
